<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUIKA FIGTHER</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1b2a14}canvas{display:block;image-rendering:pixelated}</style>
<style>#loading{position:fixed;inset:0;z-index:120;background:radial-gradient(ellipse at 50% 30%,#0c2144,#03060d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;color:#cfe3ff;transition:opacity .6s}
#loading .logo{font:900 clamp(30px,5vw,60px) 'Orbitron','Rajdhani',sans-serif;letter-spacing:.18em;color:#fff;text-shadow:0 0 18px #3fd0ff}#loading .logo b{color:#ffd23f;text-shadow:0 0 18px #ffd23f}
#loading .bar{width:min(640px,80vw);height:16px;border:1px solid #3fd0ff;padding:2px;background:rgba(2,8,18,.9)}#loading .bar i{display:block;height:100%;width:2%;background:linear-gradient(90deg,#3fd0ff,#5dff9a);box-shadow:0 0 14px #3fd0ff;transition:width .3s}
#loading .st{letter-spacing:.2em;font-size:15px;color:#7ee0ff}#loading .tip{color:#7a8db3;font-size:15px}</style>
</head><body><div id="loading"><div class="logo">SUIKA <b>FIGTHER</b></div><div class="bar"><i></i></div><div class="st">CARGANDO...</div><div class="tip">Preparando campeones, mapa, objetos y sonidos</div></div><script type="module" src="/src/main.js"></script></body></html>
